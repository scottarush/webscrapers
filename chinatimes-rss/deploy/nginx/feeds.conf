# Drop into the existing LAN server block on aiserver.
# Read-only static feeds; correct content type; short cache.
location /feeds/chinatimes/ {
    alias /srv/feeds/chinatimes/;
    default_type "application/rss+xml; charset=utf-8";
    expires 5m;
    add_header Cache-Control "public, max-age=300";
    # read-only by nature (static files owned by root, mode 0644)
}
