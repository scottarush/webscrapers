[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctime-rss"
version = "1.0.0"
description = "Self-hosted RSS publisher for China Times (chinatimes.com)"
requires-python = ">=3.11"
dependencies = [
    "feedparser==6.0.14",
    "lxml==6.1.3",
    "cssselect==1.6.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
ctime-rss = "ctime_rss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
